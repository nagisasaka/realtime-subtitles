[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "realtime-subtitles"
version = "0.1.0"
description = "Windows microphone English and Japanese realtime subtitles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.2,<3",
  "sounddevice>=0.5.1,<0.6",
  "soxr>=0.5,<2",
  "websockets>=15,<18",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]
packaging = ["pyinstaller>=6.12,<7"]

[project.scripts]
realtime-subtitles = "realtime_subtitles.main:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
